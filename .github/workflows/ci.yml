name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# bash runs each step with -e and pipefail, so a crash on the left of a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The Node 24 leg has Bun and must run the release tests; a missing Bun is an error there, not a skip.
      ORRERY_REQUIRE_BUN: ${{ matrix.node == '24' && '1' || '0' }}
      # npm ci installs pi (a devDependency, Node 22.19 or newer) on both legs: the real-pi tests must run, not skip.
      ORRERY_REQUIRE_PI: "1"
    strategy:
      fail-fast: false
      matrix:
        node: ["22.19.0", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - if: matrix.node == '24'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: npm_config_ignore_scripts=true npm ci
      - run: npm run check
      - if: matrix.node == '24'
        run: npm run test:binary
      - if: matrix.node == '24'
        run: npm run test:bun-suite

  # Bun uses the system SQLite on macOS, which differs from the one Node and Linux Bun bundle; this job runs the suite there.
  macos:
    runs-on: macos-latest
    env:
      ORRERY_REQUIRE_BUN: "1"
      ORRERY_REQUIRE_PI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: npm_config_ignore_scripts=true npm ci
      - run: npm run check
      - run: npm run test:binary
      - run: npm run test:bun-suite

  # macOS 15 refuses some folder operations macOS 26 allows (a read-only folder cannot be renamed); the installer's
  # tests run on it too.
  macos-15:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm_config_ignore_scripts=true npm ci
      - run: npm test -- test/install test/release/install-sh.test.ts
