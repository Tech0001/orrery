# tmux settings for Orrery lanes. Each lane has its own server: tmux -L orrery-<Lane> (socket under TMUX_TMPDIR).
set -g default-terminal "tmux-256color"
set -g history-limit 200000
set -g mouse on
set -s escape-time 0
setw -g aggressive-resize on
# The outer terminal shows the lane's own title: "<Lane> · idle · model · $cost".
set -g set-titles on
set -g set-titles-string "#T"
set -g status-style "bg=default,fg=colour244"
set -g status-left "#S "
set -g status-left-length 30
set -g status-right "%H:%M"
